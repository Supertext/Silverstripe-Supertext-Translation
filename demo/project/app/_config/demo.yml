---
Name: supertext-demo
After:
  - '#fluentcms'
  - '#elementalpageextension'
---
# Elemental blocks on every page, localised directly with Fluent (one block, its text per locale).
Page:
  extensions:
    - DNADesign\Elemental\Extensions\ElementalPageExtension

DNADesign\Elemental\Models\BaseElement:
  extensions:
    - TractorCow\Fluent\Extension\FluentVersionedExtension

SilverStripe\View\SSViewer:
  themes:
    - '$default'

# Readable URLs: /de/…, /fr/…, /it/…
TractorCow\Fluent\Extension\FluentDirectorExtension:
  disable_default_prefix: false

# Formal tone etc. live on the locales (Locales admin); see the demo-setup task.
Supertext\Silverstripe\Supertext:
  timeout: 180
